<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">ECHO post-electromagnetic conditioning experiment</title><desc id="desc">Five steps: baseline, apply controlled EMF, switch off and verify, observe without people present, blinded comparison to sham trials.</desc><rect width="1100" height="320" fill="#07141d"/><g font-family="Arial,sans-serif" fill="#e8f7ff"><text x="40" y="52" font-size="28" font-weight="bold">ECHO E-02 · FIELD OFF. SENSORS ON.</text><text x="40" y="82" font-size="16" fill="#9db8c7">Conceptual test sequence · no experimental results</text></g><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><rect x="32" y="115" width="200" height="118" rx="12" fill="#102735" stroke="#52b8df" stroke-width="2"/><text x="132" y="155" fill="#fff" font-weight="bold">BASELINE</text><text x="132" y="185" fill="#acd6e7" font-size="14">Record controls</text><text x="239" y="181" fill="#72c8ec" font-size="23">›</text><rect x="250" y="115" width="200" height="118" rx="12" fill="#102735" stroke="#52b8df" stroke-width="2"/><text x="350" y="155" fill="#fff" font-weight="bold">CONDITION</text><text x="350" y="185" fill="#acd6e7" font-size="14">Apply reviewed EMF</text><text x="457" y="181" fill="#72c8ec" font-size="23">›</text><rect x="468" y="115" width="200" height="118" rx="12" fill="#14394c" stroke="#52b8df" stroke-width="2"/><text x="568" y="155" fill="#fff" font-weight="bold">SHUT DOWN</text><text x="568" y="185" fill="#acd6e7" font-size="14">Verify field decay</text><text x="675" y="181" fill="#72c8ec" font-size="23">›</text><rect x="686" y="115" width="200" height="118" rx="12" fill="#102735" stroke="#52b8df" stroke-width="2"/><text x="786" y="155" fill="#fff" font-weight="bold">OBSERVE</text><text x="786" y="185" fill="#acd6e7" font-size="14">No human present</text><text x="893" y="181" fill="#72c8ec" font-size="23">›</text><rect x="904" y="115" width="200" height="118" rx="12" fill="#102735" stroke="#52b8df" stroke-width="2"/><text x="1004" y="155" fill="#fff" font-weight="bold">COMPARE</text><text x="1004" y="185" fill="#acd6e7" font-size="14">Blinded sham trials</text></g><text x="40" y="279" fill="#b7d0dd" font-family="Arial,sans-serif" font-size="16">Audio · vibration · temperature · ambient EMF · video · synchronized event IDs</text></svg>