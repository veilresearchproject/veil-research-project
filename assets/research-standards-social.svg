<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">VEIL — Core Principles and Research Standards</title><desc id="desc">Original blue and teal evidence-research artwork featuring VEIL's motto and four key principles.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#0e3947"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#123b49"/><stop offset="1" stop-color="#071b27"/></linearGradient><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#45a8b9" stroke-opacity=".16"/></pattern></defs><rect width="1080" height="1080" fill="url(#bg)"/><rect width="1080" height="1080" fill="url(#grid)"/><circle cx="960" cy="186" r="150" stroke="#3993a6" stroke-width="7" fill="#07151f"/><circle cx="960" cy="186" r="116" stroke="#70d9e4" stroke-width="2" fill="#10313f"/><circle cx="960" cy="186" r="78" fill="#07141c" stroke="#287489" stroke-width="12"/><path d="M31 165h40l15-33 18 61 16-43 15 10 18-52 16 103 21-44 20 11 18-28 15 48 19-35 17 5 18-12 20 32 21-10 20-30 21 48 27-29 25 10" stroke="#56c7d7" stroke-width="3" fill="none" opacity=".5"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="260" fill="#f1fbff" font-size="140" font-weight="bold" letter-spacing="18">VEIL</text><text x="85" y="326" fill="#d7eef2" font-size="49" font-weight="bold">Research Project</text><text x="85" y="385" fill="#93cad5" font-size="30">CORE PRINCIPLES &amp; RESEARCH STANDARDS</text></g><rect x="60" y="442" width="960" height="210" rx="12" fill="url(#card)" stroke="#6ed4df" stroke-width="3"/><g fill="#ffffff" font-family="Georgia,serif" font-style="italic" font-size="48"><text x="107" y="521">We respect your experience.</text><text x="107" y="592">We investigate your evidence.</text></g><g font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#eef9fb"><g><rect x="60" y="694" width="465" height="118" rx="10" fill="#10303d" stroke="#4a9cad" stroke-width="2"/><text x="91" y="764">Evidence Before Belief</text></g><g><rect x="555" y="694" width="465" height="118" rx="10" fill="#10303d" stroke="#4a9cad" stroke-width="2"/><text x="583" y="764">Verify Before Amplifying</text></g><g><rect x="60" y="838" width="465" height="130" rx="10" fill="#10303d" stroke="#4a9cad" stroke-width="2"/><text x="91" y="890">Ordinary Explanations</text><text x="91" y="934">Come First</text></g><g><rect x="555" y="838" width="465" height="130" rx="10" fill="#10303d" stroke="#4a9cad" stroke-width="2"/><text x="583" y="891">Unexplained Does Not</text><text x="583" y="936">Mean Paranormal</text></g></g><text x="540" y="1035" text-anchor="middle" fill="#9bd8e1" font-size="25" font-family="Arial,Helvetica,sans-serif" letter-spacing="2">RESPECTFUL  •  OBJECTIVE  •  TRANSPARENT</text></svg>